name: pipeline

# Матчи Primeira Liga играются по пятницам–воскресеньям.
#
# Запускаемся каждый час, а не раз в сутки: цель — иметь свежий срез
# прогноза на разных расстояниях до начала матча. Но пересчитывать всё
# подряд смысла нет, поэтому первый шаг — дешёвая проверка через curl+jq
# на пустом раннере: есть ли матч, стартующий в ближайшие 6 часов.
# Если нет — работа заканчивается, потратив ~10 секунд вместо полутора минут.
#
# Оговорка про точность: cron в GitHub Actions запускается с задержкой
# 5–30 минут, поэтому срез «за 4 часа» фактически получится T-4ч ±30–60 мин.
# Если нужна точность, нужен постоянно работающий сервер.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Обновить, даже если матчей в окне нет"
        type: boolean
        default: false
      skip_backtest:
        description: "Пропустить полный бэктест (быстрее, но без метрик)"
        type: boolean
        default: false

concurrency:
  group: pipeline
  cancel-in-progress: false

env:
  WINDOW_HOURS: "6"

permissions:
  # Бот коммитит обновлённые артефакты прямо в ветку — без этого права
  # публикация падает на git push.
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Проверить, есть ли матч в окне
        id: gate
        run: |
          set -euo pipefail
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "needs=true" >> "$GITHUB_OUTPUT"
            echo "принудительный запуск"
            exit 0
          fi
          now=$(date -u +%s)
          horizon=$(( now + ${WINDOW_HOURS} * 3600 ))
          # только планируемые матчи: сыгранные нам не нужны
          body=$(curl -sS --max-time 30 \
            "http://api.football-data.org/v4/competitions/PPL/matches?dateFrom=$(date -u +%Y-%m-%d)&dateTo=$(date -u -d '+7 days' +%Y-%m-%d)" \
            -H "X-Auth-Token: ${{ secrets.FD_ORG_TOKEN }}") || { echo "needs=true" >> "$GITHUB_OUTPUT"; echo "не удалось получить расписание, обновляем на всякий случай"; exit 0; }
          soon=$(printf '%s' "$body" | jq -r --argjson lo "$now" --argjson hi "$horizon" '
            [ .matches[]
              | select(.status == "TIMED" or .status == "SCHEDULED")
              | (.utcDate | fromdateiso8601) as $t
              | select($t >= $lo and $t <= $hi)
              | "\(.utcDate) \(.homeTeam.name) — \(.awayTeam.name)" ] | .[]' || true)
          if [ -n "$soon" ]; then
            echo "needs=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Ближайшие матчи в окне обновления"
              echo '```'
              printf '%s\n' "$soon"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            printf 'обновляем: матчей в окне — %s\n' "$(printf '%s\n' "$soon" | wc -l)"
          else
            echo "needs=false" >> "$GITHUB_OUTPUT"
            echo "в окне ${WINDOW_HOURS}ч матчей нет, прогнозы не трогаем"
          fi

          # Бэктест нужен раз в сутки, а не каждый час. Модуль в выражениях
          # GitHub Actions не поддерживается, поэтому решаем здесь, в bash.
          hour=$(date -u +%-H)
          if [ $(( hour % 6 )) -eq 0 ]; then
            echo "backtest=true" >> "$GITHUB_OUTPUT"
            echo "бэктест: да (час $hour)"
          else
            echo "backtest=false" >> "$GITHUB_OUTPUT"
            echo "бэктест: нет (час $hour)"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.needs == 'true'
        with:
          # журнал прогнозов нужен, чтобы история не обнулялась
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.needs == 'true'
        with:
          python-version: "3.13"
          cache: pip

      - name: Установить зависимости
        if: steps.gate.outputs.needs == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Собрать данные и обновить расписание
        if: steps.gate.outputs.needs == 'true'
        env:
          FD_ORG_TOKEN: ${{ secrets.FD_ORG_TOKEN }}
          FIXTURE_HORIZON_DAYS: "45"
        run: python -m etl.run

      - name: Калибровка снятия маржи
        if: steps.gate.outputs.needs == 'true'
        run: python -m models.market_calibration

      - name: Прогнозы и журнал
        if: steps.gate.outputs.needs == 'true'
        env:
          FD_ORG_TOKEN: ${{ secrets.FD_ORG_TOKEN }}
        run: python -m models.predict

      - name: Бэктест
        # Метрики на сезонных данных не меняются чаще раза в сутки,
        # а прогон занимает около минуты.
        if: steps.gate.outputs.needs == 'true' && steps.gate.outputs.backtest == 'true' && !inputs.skip_backtest
        run: python -m models.backtest_runner

      - name: Опубликовать артефакты
        if: steps.gate.outputs.needs == 'true'
        run: |
          mkdir -p web/public/data
          cp data/processed/predictions.json web/public/data/predictions.json
          cp data/processed/forecast_history.json web/public/data/forecast_history.json
          cp data/reports/elo_table.json web/public/data/elo_table.json
          cp data/reports/dc_strength.json web/public/data/dc_strength.json
          for f in backtest validation market_calibration; do
            [ -f "data/reports/$f.json" ] && cp "data/reports/$f.json" web/public/data/ || true
          done

      - name: Опубликовать артефакты в репозиторий
        if: steps.gate.outputs.needs == 'true'
        # Журнал прогнозов коммитим всегда: без него история обнуляется.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/data data/forecast_log.jsonl
          if git diff --cached --quiet; then
            echo "изменений нет"
          else
            git commit -m "chore(data): автообновление прогнозов [skip ci]"
            git push
          fi

      - name: Отчёт в сводке
        if: always() && steps.gate.outputs.needs == 'true'
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Проверки данных" >> "$GITHUB_STEP_SUMMARY"
          cat data/reports/validation.json >> "$GITHUB_STEP_SUMMARY"

  web-build:
    # Сборка фронта проверяется отдельно от пайплайна данных: падать должны
    # оба, но по разным причинам.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Установить зависимости фронта
        working-directory: web
        run: npm ci
      - name: Проверка типов
        working-directory: web
        run: npm run typecheck
      - name: Сборка
        working-directory: web
        run: npm run build
