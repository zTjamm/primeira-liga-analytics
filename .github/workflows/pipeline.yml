name: pipeline

# Матчи Primeira Liga играются по пятницам–воскресеньям.
#
# Запускаемся каждый час, а не раз в сутки: цель — иметь свежий срез
# прогноза на разных расстояниях до начала матча. Но пересчитывать всё
# подряд смысла нет, поэтому первый шаг — дешёвая проверка через curl+jq
# на пустом раннере: есть ли матч, стартующий в ближайшие 6 часов.
# Если нет — работа заканчивается, потратив ~10 секунд вместо полутора минут.
#
# Оговорка про точность: cron в GitHub Actions запускается с задержкой
# 5–30 минут, поэтому срез «за 4 часа» фактически получится T-4ч ±30–60 мин.
# Если нужна точность, нужен постоянно работающий сервер.
on:
  schedule:
    # Раз в 20 минут вместо раза в час. Пайплайн сам себя пропускает,
    # если впереди нет матчей и за последние часы ничего не завершилось,
    # поэтому большинство запусков обходятся проверкой за полминуты.
    # Часовое расписание означало задержку до 1ч47м между последним гудком
    # и появлением вердикта в журнале: CI считал раз в час, и сервер
    # забирал изменения ещё через час.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Обновить, даже если матчей в окне нет"
        type: boolean
        default: false
      skip_backtest:
        description: "Пропустить полный бэктест (быстрее, но без метрик)"
        type: boolean
        default: false

concurrency:
  group: pipeline
  cancel-in-progress: false

env:
  WINDOW_HOURS: "6"
  # Сколько часов назад матч ещё считается «только что завершившимся».
  # Трёх часов с запасом хватает на длительность матча: если прогон был
  # пропущен, следующий всё равно увидит результат.
  #
  # Отступ здесь обязателен. Без него ключ уезжает на верхний уровень
  # файла — YAML это допускает молча, а GitHub Actions отвергает весь
  # workflow как некорректный, и все запуски падают за 0 секунд.
  FINISHED_HOURS: "3"

permissions:
  # Бот коммитит обновлённые артефакты прямо в ветку — без этого права
  # публикация падает на git push.
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Проверить, есть ли матч в окне
        id: gate
        run: |
          set -euo pipefail
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "needs=true" >> "$GITHUB_OUTPUT"
            echo "принудительный запуск"
            exit 0
          fi
          now=$(date -u +%s)
          horizon=$(( now + ${WINDOW_HOURS} * 3600 ))
          # Смотрим в обе стороны. Раньше проверялись только предстоящие
          # матчи, из-за чего завершённый матч мог неделю лежать
          # незабранным: если новых матчей в окне нет, пайплайн просто
          # пропускал прогон, и результат в журнал не попадал.
          since=$(date -u -d "@$(( now - ${FINISHED_HOURS} * 3600 ))" +%Y-%m-%d)
          # Проверяем КОД ОТВЕТА, а не только успех curl. На HTTP-ошибке
          # curl завершается с нулём и кладёт в stdout тело ответа — то
          # есть не JSON. jq на нём падает, списки выходят пустыми, и
          # проверка заключала, что матчей нет, хотя не знала ничего.
          # Так пропускались прогоны с реальными матчами в окне.
          http_code=$(curl -sS -o /tmp/fd.json -w '%{http_code}' --max-time 30 \
            "http://api.football-data.org/v4/competitions/PPL/matches?dateFrom=$since&dateTo=$(date -u -d '+7 days' +%Y-%m-%d)" \
            -H "X-Auth-Token: ${{ secrets.FD_ORG_TOKEN }}" || echo 000)
          if [ "$http_code" != "200" ]; then
            echo "needs=true" >> "$GITHUB_OUTPUT"
            echo "расписание недоступно (HTTP $http_code), обновляем на всякий случай"
            exit 0
          fi
          if ! jq -e '.matches' /tmp/fd.json >/dev/null 2>&1; then
            echo "needs=true" >> "$GITHUB_OUTPUT"
            echo "ответ расписания не похож на JSON, обновляем на всякий случай"
            exit 0
          fi
          body=$(cat /tmp/fd.json)
          soon=$(printf '%s' "$body" | jq -r --argjson lo "$now" --argjson hi "$horizon" '
            [ .matches[]
              | select(.status == "TIMED" or .status == "SCHEDULED")
              | (.utcDate | fromdateiso8601) as $t
              | select($t >= $lo and $t <= $hi)
              | "\(.utcDate) \(.homeTeam.name) — \(.awayTeam.name)" ] | .[]' || true)
          played=$(printf '%s' "$body" | jq -r --argjson lo "$(( now - ${FINISHED_HOURS} * 3600 ))" --argjson hi "$now" '
            [ .matches[]
              | select(.status == "FINISHED")
              | (.utcDate | fromdateiso8601) as $t
              | select($t >= $lo and $t <= $hi)
              | "\(.utcDate) \(.homeTeam.name) — \(.awayTeam.name)" ] | .[]' || true)
          if [ -n "$soon" ] || [ -n "$played" ]; then
            echo "needs=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Ближайшие матчи в окне обновления"
              echo '```'
              printf '%s\n' "$soon"
              echo '```'
              if [ -n "$played" ]; then
                echo "### Только что завершившиеся (ждём результат)"
                echo '```'
                printf '%s\n' "$played"
                echo '```'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            printf 'обновляем: впереди %s, только что сыграно %s\n' \
              "$(printf '%s\n' "$soon" | grep -c . || true)" \
              "$(printf '%s\n' "$played" | grep -c . || true)"
          else
            echo "needs=false" >> "$GITHUB_OUTPUT"
            echo "в окне ${WINDOW_HOURS}ч матчей нет и за последние ${FINISHED_HOURS}ч ничего не завершилось"
          fi

          # Бэктест нужен раз в сутки, а не каждый час. Модуль в выражениях
          # GitHub Actions не поддерживается, поэтому решаем здесь, в bash.
          hour=$(date -u +%-H)
          if [ $(( hour % 6 )) -eq 0 ]; then
            echo "backtest=true" >> "$GITHUB_OUTPUT"
            echo "бэктест: да (час $hour)"
          else
            echo "backtest=false" >> "$GITHUB_OUTPUT"
            echo "бэктест: нет (час $hour)"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.needs == 'true'
        with:
          # журнал прогнозов нужен, чтобы история не обнулялась
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.needs == 'true'
        with:
          python-version: "3.13"
          cache: pip

      - name: Установить зависимости
        if: steps.gate.outputs.needs == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Собрать данные и обновить расписание
        if: steps.gate.outputs.needs == 'true'
        env:
          FD_ORG_TOKEN: ${{ secrets.FD_ORG_TOKEN }}
          FIXTURE_HORIZON_DAYS: "45"
        run: python -m etl.run

      - name: Собрать Единую лигу ВТБ
        # API лиги не требует токена, поэтому шаг работает даже если
        # секрет football-data.org по какой-то причине недоступен.
        if: steps.gate.outputs.needs == 'true'
        run: |
          python -m etl.fetch_vtb
          python -m models.bt_predict

      - name: Калибровка снятия маржи
        if: steps.gate.outputs.needs == 'true'
        run: python -m models.market_calibration
      - name: Сравнение рынков с линией
        if: steps.gate.outputs.backtest == 'true'
        # Отчёт раз в сутки: отчёты описывают качество модели на истории и заа сутки не меняются.
        # Замерка этого шага — 5 секунд, а весь самый шаг свише 5.6 минуты.
        run: python -m models.market_totals
      - name: Диагностика ошибок
        if: steps.gate.outputs.backtest == 'true'
        # Отчёт раз в сутки: отчёты описывают качество модели на истории и заа сутки не меняются.
        # Замерка этого шага — 5 секунд, а весь самый шаг свише 5.6 минуты.
        run: python -m models.error_diagnostics
      - name: Отбор матчей для вердикта
        if: steps.gate.outputs.backtest == 'true'
        # Отчёт раз в сутки: отчёты описывают качество модели на истории и заа сутки не меняются.
        # Замерка этого шага — 5 секунд, а весь самый шаг свише 5.6 минуты.
        run: python -m models.selective
      - name: Проверка неочевидных параметров
        if: steps.gate.outputs.backtest == 'true'
        # Отчёт раз в сутки: отчёты описывают качество модели на истории и заа сутки не меняются.
        # Замерка этого шага — 5 секунд, а весь самый шаг свише 5.6 минуты.
        run: python -m models.params_check
      - name: Честный эталон для сравнения
        if: steps.gate.outputs.backtest == 'true'
        # Отчёт раз в сутки: отчёты описывают качество модели на истории и заа сутки не меняются.
        # Замерка этого шага — 5 секунд, а весь самый шаг свише 5.6 минуты.
        run: python -m models.market_benchmark
      - name: Диагностика по командам
        if: steps.gate.outputs.backtest == 'true'
        # Отчёт раз в сутки: отчёты описывают качество модели на истории и заа сутки не меняются.
        # Замерка этого шага — 5 секунд, а весь самый шаг свише 5.6 минуты.
        run: python -m models.team_diagnostics
      - name: Изучение статистики матча
        if: steps.gate.outputs.backtest == 'true'
        # Отчёт раз в сутки: отчёты описывают качество модели на истории и заа сутки не меняются.
        # Замерка этого шага — 5 секунд, а весь самый шаг свише 5.6 минуты.
        run: python -m models.feature_study
    - name: Сканирование лиг
      if: steps.gate.outputs.backtest == 'true'
      run: python -m models.league_scan

      - name: Прогнозы и журнал
        if: steps.gate.outputs.needs == 'true'
        env:
          FD_ORG_TOKEN: ${{ secrets.FD_ORG_TOKEN }}
        run: python -m models.predict

      - name: Бэктесты
        # Метрики на сезонных данных не меняются чаще раза в сутки,
        # а прогон занимает около минуты.
        if: steps.gate.outputs.needs == 'true' && steps.gate.outputs.backtest == 'true' && !inputs.skip_backtest
        run: |
          python -m models.backtest_runner
          python -m models.bt_backtest

      - name: Опубликовать артефакты
        if: steps.gate.outputs.needs == 'true'
        run: |
          mkdir -p web/public/data
          for f in \
            data/processed/predictions.json \
            data/processed/football_journal.json \
            data/processed/vtb_predictions.json \
            data/processed/vtb_strength.json \
            data/processed/basketball_journal.json \
            data/reports/elo_table.json \
            data/reports/dc_strength.json \
            data/reports/backtest.json \
            data/reports/validation.json \
            data/reports/market_calibration.json \
            data/reports/market_totals.json \
            data/reports/error_diagnostics.json \
            data/reports/selective.json \
            data/reports/params_check.json \
            data/reports/market_benchmark.json \
            data/reports/team_diagnostics.json \
            data/reports/feature_study.json \
            data/reports/league_scan.json \
            data/forecast_log_football.jsonl \
            data/reports/vtb_ingest.json \
            data/reports/vtb_backtest.json ; do
            [ -f "$f" ] && cp "$f" web/public/data/ || echo "нет файла: $f"
          done
          # Старый файл журнала больше не используется: единый формат
          # football_journal.json пришёл на смену forecast_history.json.
          git rm --cached --quiet web/public/data/forecast_history.json 2>/dev/null || true
          rm -f web/public/data/forecast_history.json

      - name: Опубликовать артефакты в репозиторий
        if: steps.gate.outputs.needs == 'true'
        # Журнал прогнозов коммитим всегда: без него история обнуляется.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/data data/forecast_log_football.jsonl data/forecast_log_basketball.jsonl
          if git diff --cached --quiet; then
            echo "изменений нет"
          else
            git commit -m "chore(data): автообновление прогнозов [skip ci]"
            git push
          fi

      - name: Отчёт в сводке
        if: always() && steps.gate.outputs.needs == 'true'
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Проверки данных" >> "$GITHUB_STEP_SUMMARY"
          cat data/reports/validation.json >> "$GITHUB_STEP_SUMMARY"

  web-build:
    # Сборка фронта проверяется отдельно от пайплайна данных: падать должны
    # оба, но по разным причинам.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Установить зависимости фронта
        working-directory: web
        run: npm ci
      - name: Проверка типов
        working-directory: web
        run: npm run typecheck
      - name: Сборка
        working-directory: web
        run: npm run build
